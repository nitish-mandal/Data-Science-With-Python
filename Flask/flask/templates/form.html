<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>

<body>
    <h1>Submit a form</h1>
    {% if name %}
        <p style="color: green; font-weight: bold;">Hello, {{ name }}! Your form was submitted successfully.</p>
    {% endif %}
    <form method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
